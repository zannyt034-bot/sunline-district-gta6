<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#081014">
<meta name="description" content="Sunline District: an offline top-down coastal courier sandbox. Drive, deliver packages, evade the patrol, and use a directional flare pulse on foot.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23081014'/%3E%3Ccircle cx='32' cy='30' r='15' fill='%23ffb45e'/%3E%3Cpath d='M8 48c7-5 14-5 21 0s14 5 27 0' fill='none' stroke='%2362e2d0' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Sunline District — a coastal courier story</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #081014; }
  body { font-family: 'DejaVu Sans', 'Liberation Sans', 'Segoe UI', sans-serif; }
  #game {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    outline: none; touch-action: none; cursor: crosshair; background: #081014;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .fallback {
    position: fixed; inset: 0; display: grid; place-items: center; color: #f5eddc;
    background: #081014; text-align: center; padding: 2rem; font-size: 1rem;
  }
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Sunline District, an offline top-down coastal courier game. Drive and deliver packages; on foot, press Space for a directional flare pulse to briefly stun pursuers."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<noscript><div class="fallback">Sunline District needs JavaScript enabled to run this offline game.</div></noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
